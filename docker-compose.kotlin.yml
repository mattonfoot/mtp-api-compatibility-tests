services:
  mtp-api:
    build:
      context: ../money-to-prisoners-api
    networks:
      - hmpps
    depends_on:
      mtp-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -sf http://localhost:8080/health/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://mtp-db:5432/mtp_api
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_FLYWAY_URL: jdbc:postgresql://mtp-db:5432/mtp_api
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: postgres
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
